name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: printer
    attributes:
      label: Printer model and firmware
      placeholder: K1 Max, 1.3.5.22
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.2"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings → Devices & services → Creality Cloud → ⋮ → Download diagnostics. Attach the file here.
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: Lines from Settings → System → Logs that mention creality_cloud.
      render: text
